<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aether Luxe | 3D Showcase</title>
  <style>
    :root {
      --bg-primary: #030712;
      --bg-surface: #0f172a;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(15, 23, 42, 0.75);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
    .main-wrapper {
      max-width: 1200px;
      margin: 50px auto;
      padding: 0 30px;
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 50px;
      align-items: center;
      flex: 1;
    }
    #3d-product-stage {
      width: 100%;
      height: 480px;
      background: #020617;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
      overflow: hidden;
    }
    .product-info {
      background: var(--bg-surface);
      padding: 40px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    h1 { font-size: 34px; font-weight: 800; margin-bottom: 10px; }
    .price { font-size: 26px; font-weight: 700; color: var(--accent); margin-bottom: 20px; }
    .desc { color: var(--text-muted); font-size: 15px; line-height: 1.6; margin-bottom: 30px; }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      color: #fff;
      border: none;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
    }
    @media (max-width: 900px) { .main-wrapper { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <header>
    <div class="logo">Aether Luxe</div>
  </header>

  <div class="main-wrapper">
    <div id="3d-product-stage"></div>

    <div class="product-info">
      <h1>Celestial Precision Ring</h1>
      <div class="price">$450.00</div>
      <p class="desc">Featuring high-gloss physical material shaders and real-time studio lighting.</p>
      <button class="btn">Add to Cart</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="./embed.js"></script>
</body>
</html>
